<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sample competition entry form (test fixture – dummy data only)</title>
<style>body{font:15px system-ui;margin:24px;max-width:640px}label{display:block;margin:10px 0 2px}input,select,textarea{padding:6px;width:320px}.hp{position:absolute;left:-5000px}</style></head><body>
<h1>Win a dummy prize</h1>
<form id="f" onsubmit="window.__submitted=true;return false">
  <label for="t">Title</label>
  <select id="t" name="title"><option value="">Please select</option><option>Mr</option><option>Mrs</option><option>Miss</option><option>Ms</option><option>Dr</option></select>
  <label for="fn">First name</label><input id="fn" name="firstname" autocomplete="given-name">
  <label for="ln">Surname</label><input id="ln" name="surname">
  <label for="em">Email address</label><input id="em" name="email" type="email">
  <label for="em2">Confirm email</label><input id="em2" name="email_confirm">
  <label for="ph">Mobile number</label><input id="ph" name="mobile" type="tel">
  <label for="a1">Address line 1</label><input id="a1" name="address1">
  <label for="a2">Address line 2</label><input id="a2" name="address2">
  <label for="tw">Town / City</label><input id="tw" name="city">
  <label for="co">County</label><input id="co" name="county">
  <label for="pc">Postcode</label><input id="pc" name="postcode">
  <fieldset><legend>Date of birth</legend>
    <select name="dob_day" aria-label="Day"><option value="">Day</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option></select>
    <select name="dob_month" aria-label="Month"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option></select>
    <select name="dob_year" aria-label="Year"><option value="">Year</option><option>1985</option><option>1990</option><option>1991</option><option>1992</option></select>
  </fieldset>
  <label for="hpf">Leave this empty</label><input id="hpf" class="hp" name="website_hp" tabindex="-1" autocomplete="off">
  <label for="cap">Enter the captcha code</label><input id="cap" name="captcha">
  <label for="ans">Tie-breaker: in 25 words, why do you love prizes?</label><textarea id="ans" name="answer"></textarea>
  <label for="promo">Promo code</label><input id="promo" name="promo_code">
  <label><input type="checkbox" id="news" name="newsletter"> Yes, send me marketing emails and the newsletter</label>
  <label><input type="checkbox" id="terms" name="terms"> I have read the terms &amp; conditions</label>
  <p><button type="submit" id="go">Enter competition</button></p>
</form></body></html>
