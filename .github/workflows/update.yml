name: Update competitions & deploy site

on:
  schedule:
    - cron: "17 * * * *"      # hourly, at minute 17 (UTC)
    - cron: "47 */2 * * *"    # backup slot: GitHub sometimes drops scheduled runs for hours; the concurrency group never overlaps runs
  workflow_dispatch:
    inputs:
      only:
        description: "Debug (UK job only): run only these sources (comma-separated exact names). Leave empty for a normal full run."
        required: false
        default: ""

# never run two hourly runs at once (each country job takes ~2-15 min, all in parallel); let a running one finish
concurrency:
  group: update-competitions
  cancel-in-progress: false

permissions:
  contents: write     # push state/data to the `data` branch (+ the rare keep-alive commit)
  actions: write      # keep-alive: re-enable this workflow so GitHub's 60-day inactivity pause never applies
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # One collector job per country, in parallel. Each keeps its own state file on the `data` branch
  # (UK: state.json, as before; others: state-<cc>.json). A failed country never blocks the others:
  # the publish job keeps that country's previous data file.
  collect:
    runs-on: ubuntu-24.04      # pinned: `ubuntu-latest` moves to Ubuntu 26 on 19 Oct 2026
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        country: [uk, de, fr, nl, ie, it, au, nz]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout data branch (state + last data)
        uses: actions/checkout@v7
        with:
          ref: data
          path: databr

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector (${{ matrix.country }})
        env:
          ONLY: ${{ github.event.inputs.only }}
          CC: ${{ matrix.country }}
        run: |
          args=()
          if [ -n "$ONLY" ] && [ "$CC" = "uk" ]; then
            IFS=',' read -r -a names <<< "$ONLY"
            args=(--only "${names[@]}")
          fi
          if [ "$CC" = "uk" ]; then st=databr/state.json; else st="databr/state-$CC.json"; fi
          mkdir -p out
          python -u -m comptracker.ci --country "$CC" --state "$st" --out out "${args[@]}"
          cp "$st" out/
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.country }}
          path: out/
          retention-days: 1

  publish:
    needs: collect
    if: ${{ !cancelled() }}      # publish whatever countries succeeded; failed ones keep last hour's file
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: databr

      - uses: actions/download-artifact@v8
        with:
          pattern: data-*
          path: dl
        continue-on-error: true

      - name: Merge country results + assemble site
        run: |
          mkdir -p databr/data _site/data
          for cc in uk de fr nl ie it au nz; do
            d="dl/data-$cc"
            if [ -s "$d/$cc.json" ]; then
              cp "$d/$cc.json" databr/data/
              for f in "$d"/state*.json; do [ -f "$f" ] && cp "$f" databr/; done
              echo "$cc: updated"
            else
              echo "::warning::$cc collector failed this run - keeping its previous data file"
            fi
            [ -f "databr/data/$cc.json" ] && cp "databr/data/$cc.json" _site/data/
          done
          # UK: also the original competitions.json (old links and older page versions)
          if [ -f databr/data/uk.json ]; then cp databr/data/uk.json databr/competitions.json; fi
          [ -f databr/competitions.json ] && cp databr/competitions.json _site/competitions.json
          [ -f _site/data/uk.json ] || { [ -f _site/competitions.json ] && cp _site/competitions.json _site/data/uk.json; }
          cp web/index.html _site/index.html
          mkdir -p _site/autofill && cp autofill/uk-comp-autofill.user.js _site/autofill/   # also downloadable from the Pages site
          touch _site/.nojekyll
          ls -la _site _site/data

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1

      # prize pictures: thumbnails of the promoter page for items that still have no picture (og:image is already tried by
      # the collector). Cached per item on the `data` branch (never in main's history), new items only, per-run budget.
      - name: Screenshot thumbnails
        continue-on-error: true
        timeout-minutes: 9
        run: |
          pip install -r requirements.txt playwright pillow
          python -m playwright install --with-deps chromium
          python -u -m comptracker.shots databr _site --budget 40 --minutes 6
          [ -f databr/data/uk.json ] && cp databr/data/uk.json databr/competitions.json && cp databr/competitions.json _site/competitions.json
          du -sh databr/shots _site/shots || true

      - name: Commit data (single squashed commit on `data` branch, so history never grows)
        working-directory: databr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-new
          git add -A
          git commit -q -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin data-new:data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # ---- keep the hourly schedule alive -------------------------------------------------------------
      # GitHub pauses scheduled workflows after 60 days without repository activity. Two cheap safeguards:
      #  1. re-enable this workflow through the API (resets the inactivity timer; harmless if already enabled)
      #  2. if `main` has had no commit for 30+ days, add one tiny keep-alive commit (does not trigger this workflow)
      - name: Keep-alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable" && echo "workflow re-enabled (keep-alive)"
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit on main: ${age_days} day(s) ago"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +'%Y-%m-%d' > .github/keepalive
            git add .github/keepalive
            git commit -q -m "chore: keep-alive (repository had no commits for ${age_days} days)" && git push origin HEAD:main
          fi
          # schedule health: warn if no scheduled run has happened for >3h (cron can be delayed, but not for long)
          n=$(gh run list --workflow update.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null)
          echo "latest scheduled run: ${n:-none yet}"
          if [ -z "$n" ]; then echo "::warning::No scheduled (cron) run has been seen yet"; fi

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
