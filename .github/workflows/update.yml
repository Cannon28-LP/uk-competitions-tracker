name: Update competitions & deploy site

on:
  schedule:
    - cron: "17 * * * *"      # hourly, at minute 17 (UTC)
  workflow_dispatch:

# never run two collectors at once (a full run takes ~12-15 min); let a running one finish
concurrency:
  group: update-competitions
  cancel-in-progress: false

permissions:
  contents: write     # push state/data to the `data` branch
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data branch (state.json + last competitions.json)
        uses: actions/checkout@v4
        with:
          ref: data
          path: databr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python -u -m comptracker.ci --state databr/state.json --out _site

      - name: Assemble site
        run: |
          cp web/index.html _site/index.html
          touch _site/.nojekyll
          cp _site/competitions.json databr/competitions.json
          ls -la _site

      - name: Commit data (single squashed commit on `data` branch, so history never grows)
        working-directory: databr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-new
          git add -A
          git commit -q -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin data-new:data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
